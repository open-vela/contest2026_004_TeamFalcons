# STM32H750B-DK (VelaGuard) OpenOCD board configuration.
#
# Cortex-Debug attaches through the ST-LINK SWD port. Flashing is done by
# CubeProgrammer (windows_flash_cube.ps1); OpenOCD is only the GDB server,
# so launch.json uses loadFiles: [] and never programs the target here.
#
# interface/target scripts are resolved by `find` from the OpenOCD
# installation's bundled script dir (xPack: openocd/scripts next to the exe).

source [find interface/stlink.cfg]
source [find target/stm32h7x.cfg]
transport select swd
