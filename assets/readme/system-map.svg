<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="title desc">
  <title id="title">VelaGuard 系统形态示意</title>
  <desc id="desc">Modbus 从站经 RS485 进入 STM32H750B-DK。openvela 在本地执行周期采集、帧统计、阈值与离线告警、配置存储和 LVGL 显示。板载 ai_agent 经 HTTPS 访问 MiMo，做解释、运行报告与查数。MQTT Broker 接收明文在线状态。RJ45 为主链路，ESP-01S 为备链路；断网不影响本地采集与告警。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; fill: #18181b; }
    .muted { fill: #71717a; }
    .local { fill: #047857; }
    .network { fill: #0369a1; }
    .node { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
    .rule { fill: none; stroke: #e4e4e7; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L6 5L2 9" fill="none" stroke="#71717a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="648" fill="#ffffff"/>
  <g id="heading">
    <text x="48" y="46" class="muted" font-size="18">01 / SYSTEM</text>
    <text x="48" y="102" font-size="40" font-weight="600">现场到云端，各自负责什么</text>
    <text x="48" y="144" class="muted" font-size="22">采集、告警与显示在板上运行；解释、运行报告与查数走云端 MiMo。</text>
  </g>

  <g id="field">
    <text x="48" y="204" class="muted" font-size="20">现场设备</text>
    <rect x="48" y="228" width="264" height="274" rx="8" class="node"/>
    <text x="72" y="274" font-size="26" font-weight="600">Modbus 从站</text>
    <text x="72" y="324" font-size="22">温湿度 / 流量</text>
    <text x="72" y="360" font-size="22">电量 / 水浸</text>
    <path d="M72 408H288" class="rule"/>
    <text x="72" y="454" class="muted" font-size="20">RS485 · 9600 baud</text>
  </g>

  <g id="gateway">
    <text x="372" y="204" class="local" font-size="20">独立板端</text>
    <rect x="372" y="228" width="440" height="274" rx="8" class="node"/>
    <text x="396" y="270" font-size="26" font-weight="600">STM32H750B-DK</text>
    <text x="396" y="302" class="muted" font-size="20">openvela / NuttX</text>
    <text x="396" y="342" font-size="22">周期采集 · 帧质量统计</text>
    <text x="396" y="374" font-size="22">阈值 / 离线告警 · 配置存储</text>
    <text x="396" y="406" font-size="22">LVGL HMI · NSH</text>
    <path d="M396 426H788" class="rule"/>
    <text x="396" y="456" class="network" font-size="22" font-weight="600">ai_agent</text>
    <text x="528" y="456" font-size="20">解释 / 运行报告 / 查数</text>
  </g>

  <g id="network-services">
    <text x="872" y="204" class="network" font-size="20">联网服务</text>
    <rect x="872" y="228" width="280" height="274" rx="8" class="node"/>
    <text x="896" y="274" class="network" font-size="26" font-weight="600">MiMo LLM</text>
    <text x="896" y="310" font-size="22">HTTPS 直连</text>
    <path d="M896 342H1128" class="rule"/>
    <text x="896" y="388" font-size="26" font-weight="600">MQTT Broker</text>
    <text x="896" y="426" font-size="22">在线状态上报（明文）</text>
    <text x="896" y="474" class="muted" font-size="18">遥测加密与 OTA 规划中</text>
  </g>

  <g id="connections" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M320 366H364"/>
    <path d="M820 366H864" stroke-dasharray="4 4"/>
  </g>
  <g id="operating-boundary">
    <path d="M48 540H1152" class="rule"/>
    <text x="48" y="580" class="local" font-size="22">断网照常：采集、告警、统计、配置与显示。</text>
    <text x="48" y="616" class="muted" font-size="20">网络出口：RJ45 主链路 / ESP-01S 备链路</text>
  </g>
</svg>
