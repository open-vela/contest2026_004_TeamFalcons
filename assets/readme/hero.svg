<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VelaGuard | RS485 / Modbus 现场网关</title>
  <desc id="desc">运行在 STM32H750B-DK 与 openvela 上的独立现场网关。本地采集与告警，板载 Agent 解释告警与生成日报，点表变更由人确认。三个查询入口为 vgpoint get、vgstats dump 与 ai_agent。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .foreground { fill: #fafafa; }
    .muted { fill: #a1a1aa; }
    .prompt { fill: #6ee7b7; }
  </style>

  <rect width="1200" height="420" fill="#09090b"/>
  <g id="identity">
    <text x="56" y="52" class="muted" font-size="18">openvela / FIELD GATEWAY</text>
    <text x="1144" y="52" class="mono muted" font-size="18" text-anchor="end">STM32H750B-DK</text>
    <text x="56" y="152" class="foreground" font-size="76" font-weight="650">VelaGuard</text>
    <text x="56" y="214" class="foreground" font-size="32" font-weight="500">RS485 / Modbus 现场网关</text>
    <text x="56" y="262" class="muted" font-size="23">本地采集与告警 · Agent 解释与日报 · 点表人工确认</text>
  </g>

  <g id="command-entrypoints" xml:space="preserve">
    <path d="M56 308H1144 M392 340V390 M768 340V390" fill="none" stroke="#27272a" stroke-width="1.5"/>
    <g transform="translate(56 0)">
      <text y="348" class="muted" font-size="18">读取采集快照</text>
      <text y="386" class="mono foreground" font-size="23"><tspan class="prompt">nsh&gt; </tspan>vgpoint get</text>
    </g>
    <g transform="translate(432 0)">
      <text y="348" class="muted" font-size="18">检查通信质量</text>
      <text y="386" class="mono foreground" font-size="23"><tspan class="prompt">nsh&gt; </tspan>vgstats dump</text>
    </g>
    <g transform="translate(808 0)">
      <text y="348" class="muted" font-size="18">进入运营助手</text>
      <text y="386" class="mono foreground" font-size="23"><tspan class="prompt">nsh&gt; </tspan>ai_agent</text>
    </g>
  </g>
</svg>
