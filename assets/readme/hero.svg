<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">VelaGuard — openvela RS485/Modbus 现场网关</title>
  <desc id="desc">左侧为项目名称与定位：本地确定性采集告警，板载 AI 运营助手；右侧为现场从站经网关连接云端 LLM 与 MQTT 的拓扑示意。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#7E8F9A" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#2EC4B6" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#0E1317"/>

  <g stroke="#24303A" stroke-width="1" opacity="0.9">
    <path d="M48 318 H1152"/>
    <path d="M48 338 H1152"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="58" fill="#7E8F9A" font-size="16" letter-spacing="1.2">openvela · AI 硬件产品创新 · Team Falcons</text>
    <text x="56" y="118" fill="#F2F6F8" font-size="56" font-weight="700">VelaGuard</text>
    <text x="56" y="162" fill="#2EC4B6" font-size="24" font-weight="600">RS485 / Modbus 现场网关</text>
    <text x="56" y="204" fill="#C5D0D7" font-size="20">本地确定性采集与告警，断网也继续；</text>
    <text x="56" y="234" fill="#C5D0D7" font-size="20">板载 ai_agent 只解释、只汇总、只查数，不写总线。</text>
    <text x="56" y="274" fill="#7E8F9A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STM32H750B-DK · openvela / NuttX · LVGL HMI</text>
  </g>

  <!-- proof topology: fits inside 1200 with 48px margin -->
  <g transform="translate(600 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="40" width="118" height="150" rx="12" fill="#172027" stroke="#3A4A56" stroke-width="1.5"/>
    <text x="59" y="70" text-anchor="middle" fill="#7E8F9A" font-size="15">现场侧</text>
    <g font-size="15" fill="#C5D0D7" text-anchor="middle">
      <rect x="14" y="88" width="90" height="28" rx="6" fill="#1E2A33" stroke="#3A4A56"/>
      <text x="59" y="107">温湿度</text>
      <rect x="14" y="124" width="90" height="28" rx="6" fill="#1E2A33" stroke="#3A4A56"/>
      <text x="59" y="143">电表</text>
      <rect x="14" y="160" width="90" height="28" rx="6" fill="#1E2A33" stroke="#3A4A56"/>
      <text x="59" y="179">流量计</text>
    </g>

    <path d="M118 115 H162" stroke="#F4A261" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="140" y="104" text-anchor="middle" fill="#F4A261" font-size="13" font-family="ui-monospace, Menlo, monospace">485</text>

    <rect x="162" y="20" width="198" height="190" rx="12" fill="#172027" stroke="#F4A261" stroke-width="2"/>
    <text x="261" y="50" text-anchor="middle" fill="#F4A261" font-size="17" font-weight="600">VelaGuard 网关</text>
    <text x="261" y="74" text-anchor="middle" fill="#7E8F9A" font-size="13" font-family="ui-monospace, Menlo, monospace">H750B-DK + openvela</text>
    <g font-size="14" fill="#C5D0D7">
      <rect x="178" y="92" width="166" height="28" rx="6" fill="#1E2A33" stroke="#F4A261"/>
      <text x="261" y="111" text-anchor="middle">本地采集 / 告警 / 统计</text>
      <rect x="178" y="128" width="166" height="28" rx="6" fill="#1E2A33" stroke="#3A4A56"/>
      <text x="261" y="147" text-anchor="middle">LVGL 只读 + 确认</text>
      <rect x="178" y="164" width="166" height="28" rx="6" fill="#1E2A33" stroke="#2EC4B6"/>
      <text x="261" y="183" text-anchor="middle" fill="#2EC4B6">ai_agent 运营助手</text>
    </g>

    <path d="M360 115 H404" stroke="#7E8F9A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <path d="M360 183 H404" stroke="#2EC4B6" stroke-width="2" marker-end="url(#arrow-ai)"/>

    <rect x="404" y="40" width="140" height="150" rx="12" fill="#172027" stroke="#3A4A56" stroke-width="1.5"/>
    <text x="474" y="70" text-anchor="middle" fill="#7E8F9A" font-size="15">云端</text>
    <g font-size="14" fill="#C5D0D7" text-anchor="middle">
      <rect x="418" y="88" width="112" height="36" rx="6" fill="#1E2A33" stroke="#3A4A56"/>
      <text x="474" y="111">MQTT 遥测</text>
      <rect x="418" y="136" width="112" height="36" rx="6" fill="#1E2A33" stroke="#2EC4B6"/>
      <text x="474" y="159" fill="#2EC4B6">MiMo LLM</text>
    </g>

    <g font-size="14" fill="#7E8F9A">
      <line x1="0" y1="248" x2="28" y2="248" stroke="#F4A261" stroke-width="2.5"/>
      <text x="36" y="253">永远本地</text>
      <line x1="120" y1="248" x2="148" y2="248" stroke="#7E8F9A" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="156" y="253">MQTT / 网络</text>
      <line x1="260" y1="248" x2="288" y2="248" stroke="#2EC4B6" stroke-width="2"/>
      <text x="296" y="253">AI 解释链路</text>
    </g>
  </g>
</svg>
