<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc">
  <title id="title">VelaGuard Agent 的访问范围</title>
  <desc id="desc">C 工具层拒绝 vgpoint 和 vgdiscover，vgcfg 只允许 dump，文件工具限定在 /data/agent 与 /data/velaguard。点表变更须由人试读后单独执行 apply --confirm。当前 vgstats 和 vgnet 尚未按子命令限制，inject、reset、wifi 会改变状态，不能将整个允许表视为严格只读。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; fill: #18181b; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .muted { fill: #71717a; }
    .restricted { fill: #047857; }
    .warning { fill: #b91c1c; }
    .rule { fill: none; stroke: #e4e4e7; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="668" fill="#ffffff"/>
  <g id="heading">
    <text x="48" y="46" class="muted" font-size="18">02 / AGENT BOUNDARY</text>
    <text x="48" y="102" font-size="40" font-weight="600">Agent 的访问范围</text>
    <text x="48" y="144" class="muted" font-size="22">点表提交由人确认，解释与日报只作为建议。</text>
  </g>

  <g id="access-matrix">
    <rect x="48" y="190" width="1104" height="48" fill="#fafafa"/>
    <g font-size="20">
      <text x="72" y="222" class="muted">入口</text>
      <text x="344" y="222" class="muted">当前规则</text>
      <text x="928" y="222" class="muted">边界</text>
    </g>
    <path d="M48 238H1152 M48 308H1152 M48 378H1152 M48 448H1152 M48 518H1152" class="rule"/>

    <text x="72" y="282" class="mono" font-size="24">run_shell</text>
    <text x="344" y="282" font-size="22">拒绝 vgpoint / vgdiscover</text>
    <text x="928" y="282" class="warning" font-size="22">禁止调用</text>

    <text x="72" y="352" class="mono" font-size="24">vgcfg</text>
    <text x="344" y="352" font-size="22">仅允许 dump</text>
    <text x="928" y="352" class="restricted" font-size="22">仅查询</text>

    <text x="72" y="422" font-size="24">文件工具</text>
    <text x="344" y="422" class="mono" font-size="20">/data/agent · /data/velaguard</text>
    <text x="928" y="422" class="restricted" font-size="22">路径限制</text>

    <text x="72" y="492" font-size="24">点表变更</text>
    <text x="344" y="492" font-size="22">试读后，人工 apply --confirm</text>
    <text x="928" y="492" font-size="22">人工确认</text>
  </g>

  <g id="known-gap">
    <rect x="48" y="548" width="1104" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="582" class="warning" font-size="22" font-weight="600">待补强</text>
    <text x="210" y="582" class="warning" font-size="22">vgstats / vgnet 尚未按子命令限制</text>
    <text x="72" y="620" class="warning" font-size="20">inject / reset / wifi 会改变统计或网络状态，不能将整个允许表视为严格只读。</text>
  </g>
</svg>
