<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent 安全边界</title>
  <desc id="desc">AI Agent 只能通过只读 C 工具访问已采集数据；写寄存器、改配置、清告警、总线探测实验在工具层不存在。输出经 schema 校验后标注 AI 推测，处置须人工确认。</desc>

  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#2EC4B6" stroke-width="1.4"/>
    </marker>
    <marker id="block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#F4A261" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#0E1317"/>

  <text x="48" y="48" fill="#7E8F9A" font-size="16" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" letter-spacing="1">SAFETY BOUNDARY</text>
  <text x="48" y="88" fill="#F2F6F8" font-size="30" font-weight="700" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">能对活着的工业总线下指令的 LLM 是危险品</text>
  <text x="48" y="120" fill="#C5D0D7" font-size="18" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">边界写在 C 工具注册层，不依赖 prompt 自觉。</text>

  <!-- Agent -->
  <g transform="translate(48 160)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="170" height="140" rx="12" fill="#172027" stroke="#2EC4B6" stroke-width="2"/>
    <text x="85" y="50" text-anchor="middle" fill="#2EC4B6" font-size="18" font-weight="600">AI Agent</text>
    <text x="85" y="82" text-anchor="middle" fill="#C5D0D7" font-size="15">ReAct ≤ 10 轮</text>
    <text x="85" y="110" text-anchor="middle" fill="#8B9BA6" font-size="14">解释 / 报告 / 查数</text>
  </g>

  <path d="M218 230 H262" stroke="#2EC4B6" stroke-width="2" marker-end="url(#ok)" fill="none"/>

  <!-- Guard -->
  <g transform="translate(262 160)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="200" height="140" rx="12" fill="#172027" stroke="#F4A261" stroke-width="2"/>
    <text x="100" y="46" text-anchor="middle" fill="#F4A261" font-size="18" font-weight="600">tool_guard</text>
    <text x="100" y="78" text-anchor="middle" fill="#C5D0D7" font-size="15">只读注册表 + 沙箱</text>
    <text x="100" y="104" text-anchor="middle" fill="#8B9BA6" font-size="14">限流 · 参数上界</text>
    <text x="100" y="126" text-anchor="middle" fill="#8B9BA6" font-size="14">会话门控 · 审计日志</text>
  </g>

  <!-- Allowed -->
  <path d="M462 200 H510" stroke="#2EC4B6" stroke-width="2" marker-end="url(#ok)" fill="none"/>
  <text x="486" y="190" text-anchor="middle" fill="#2EC4B6" font-size="14" font-family="-apple-system, 'PingFang SC', sans-serif">允许</text>

  <g transform="translate(510 168)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="200" height="64" rx="10" fill="#1E2A33" stroke="#2EC4B6"/>
    <text x="100" y="28" text-anchor="middle" fill="#2EC4B6" font-size="16" font-weight="600">只读查询</text>
    <text x="100" y="50" text-anchor="middle" fill="#8B9BA6" font-size="14">状态 / 历史 / 实时值</text>
  </g>

  <!-- Blocked -->
  <path d="M462 260 H510" stroke="#F4A261" stroke-width="2" marker-end="url(#block)" fill="none"/>
  <text x="486" y="250" text-anchor="middle" fill="#F4A261" font-size="14" font-family="-apple-system, 'PingFang SC', sans-serif">不存在</text>

  <g transform="translate(510 228)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="200" height="64" rx="10" fill="#1E2A33" stroke="#F4A261" stroke-dasharray="4 3"/>
    <text x="100" y="28" text-anchor="middle" fill="#F4A261" font-size="16" font-weight="600">写寄存器 / 改配置</text>
    <text x="100" y="50" text-anchor="middle" fill="#8B9BA6" font-size="14">清告警 / 总线实验</text>
  </g>

  <path d="M710 200 H758" stroke="#2EC4B6" stroke-width="2" marker-end="url(#ok)" fill="none"/>

  <g transform="translate(758 160)" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="394" height="140" rx="12" fill="#172027" stroke="#3A4A56" stroke-width="1.5"/>
    <text x="197" y="42" text-anchor="middle" fill="#F2F6F8" font-size="17" font-weight="600">输出侧</text>
    <g fill="#C5D0D7" font-size="15" text-anchor="middle">
      <text x="197" y="78">schema 校验 → 风险分级</text>
      <text x="197" y="108">LVGL 标注「AI 推测」</text>
      <text x="197" y="134" fill="#F4A261">人工确认后才由本地代码执行</text>
    </g>
  </g>
</svg>
