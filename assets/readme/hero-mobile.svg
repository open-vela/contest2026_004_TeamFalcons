<svg xmlns="http://www.w3.org/2000/svg" width="480" height="552" viewBox="0 0 480 552" role="img" aria-labelledby="title desc">
  <title id="title">VelaGuard | RS485 / Modbus 现场网关</title>
  <desc id="desc">openvela 上的独立现场网关：本地采集与告警，Agent 解释与日报，点表由人确认。NSH 查询入口为 vgpoint get、vgstats dump 与 ai_agent。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .foreground { fill: #fafafa; }
    .muted { fill: #a1a1aa; }
    .prompt { fill: #6ee7b7; }
  </style>

  <rect width="480" height="552" fill="#09090b"/>
  <g id="identity">
    <text x="28" y="42" class="muted" font-size="18">openvela / STM32H750B-DK</text>
    <text x="28" y="116" class="foreground" font-size="54" font-weight="650">VelaGuard</text>
    <text x="28" y="166" class="foreground" font-size="26" font-weight="500">RS485 / Modbus 现场网关</text>
    <text x="28" y="208" class="muted" font-size="20">本地采集与告警，Agent 解释与日报。</text>
    <text x="28" y="240" class="muted" font-size="20">点表变更由人确认。</text>
  </g>

  <g id="command-entrypoints" xml:space="preserve">
    <path d="M28 272H452 M28 362H452 M28 452H452" fill="none" stroke="#27272a"/>
    <text x="28" y="308" class="muted" font-size="18">读取采集快照</text>
    <text x="28" y="342" class="mono foreground" font-size="24"><tspan class="prompt">nsh&gt; </tspan>vgpoint get</text>
    <text x="28" y="398" class="muted" font-size="18">检查通信质量</text>
    <text x="28" y="432" class="mono foreground" font-size="24"><tspan class="prompt">nsh&gt; </tspan>vgstats dump</text>
    <text x="28" y="488" class="muted" font-size="18">进入运营助手</text>
    <text x="28" y="522" class="mono foreground" font-size="24"><tspan class="prompt">nsh&gt; </tspan>ai_agent</text>
  </g>
</svg>
