# OpenOCD 配置：ST-LINK/V3 (STM32H750B-DK) 复位下连接。
#
# 为什么不用 ST-LINK_gdbserver：在这台机器上它对运行中的目标始终报
# "Target no device found"，-g / -k / 降频都试过；而 STM32_Programmer_CLI
# 用 mode=UR 能连上。OpenOCD 的 st-link 适配器驱动（dapdirect）可以正常复位下连接。
#
# 用法（从本仓根目录，Windows 侧）：
#   openocd.exe -s <openocd>\scripts -f scripts/gdb/stlink-h7.cfg -c init -c "reset run"
# 然后另开一个 arm-none-eabi-gdb 连 localhost:3333。
#
# 注意 reset_config 带 connect_assert_srst，所以**每次 GDB attach 都会复位板子**。
# 需要跨"复位"保存状态的实验（例如往栈里填模式再回读）必须放在同一个 GDB 会话里做。

source [find interface/stlink.cfg]
transport select swd
adapter serial 0043001D3137511133333639
adapter speed 1000

source [find target/stm32h7x.cfg]

# 应用运行时 SWD 无法直接附着，必须让适配器在连接期间拉住 NRST。
reset_config srst_only srst_nogate connect_assert_srst
